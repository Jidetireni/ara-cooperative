{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <div style="display:none;max-height:0;overflow:hidden;">{{template "preheader" .}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td style="padding:32px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#231a15;">
          <tr>
            <td style="padding-bottom:24px;font-size:15px;font-weight:700;color:#7a4a2a;">Ara Cooperative</td>
          </tr>
          <tr>
            <td>{{template "content" .}}</td>
          </tr>
          <tr>
            <td style="padding-top:24px;border-top:1px solid #eeeeee;font-size:13px;line-height:1.5;color:#6b5d53;">{{template "footer" .}}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>{{end}}
